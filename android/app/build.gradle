plugins { id 'com.android.application' }

android {
    namespace 'io.github.vukiengiang.petstudio'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.vukiengiang.petstudio'
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName '1.7.1'
        resConfigs 'vi', 'en'
    }

    signingConfigs {
        // Khoá công khai của app (PKCS12, mật khẩu 'petstudio'). Có chủ đích
        // commit để mọi bản build ra cùng một chữ ký, nhờ vậy cài đè mà không
        // phải gỡ app. Đừng dùng khoá này để phát hành lên CH Play — hãy tạo
        // keystore riêng và đưa vào GitHub Secrets.
        release {
            storeFile file('petstudio-release.p12')
            storeType 'PKCS12'
            storePassword 'petstudio'
            keyAlias 'petstudio'
            keyPassword 'petstudio'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += ['META-INF/*.kotlin_module']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
