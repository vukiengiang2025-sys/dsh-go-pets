name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'pet-studio/**'
      - 'app/assets/pets/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Web app tests
        run: node --test pet-studio/*.test.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          set -e
          SDK=/usr/local/lib/android/sdk
          if [ ! -d "$SDK" ]; then SDK="$ANDROID_HOME"; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)"
          echo "SDKMANAGER=$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle web app into APK assets
        run: |
          set -e
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www/app/assets/pets
          cp -r pet-studio android/app/src/main/assets/www/pet-studio
          cp -r app/assets/pets/* android/app/src/main/assets/www/app/assets/pets/
          python3 app/tool/check_pack_sheets.py
          du -sh android/app/src/main/assets/www

      - name: Build release APK
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace

      - name: Build release AAB
        run: gradle -p android :app:bundleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: PetStudio-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Verify and name APK
        run: |
          set -e
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" | head -6
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | head -4
          unzip -l "$APK" | grep -E 'assets/www/(pet-studio/index.html|app/assets/pets/dsh-bot/pack.json)'
          for meta in app/assets/pets/*/pack.json; do
            id=$(basename "$(dirname "$meta")")
            unzip -l "$APK" | grep -q "assets/www/app/assets/pets/$id/pack.json" || { echo "missing pack $id"; exit 1; }
          done
          cp "$APK" PetStudio.apk
          sha256sum PetStudio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PetStudio-apk
          path: PetStudio.apk
          if-no-files-found: error

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Pet Studio Android (bản mới nhất)
          body: APK build tự động, không cần mạng. Cài trên Android 7.0+.
          files: PetStudio.apk
          make_latest: true
