name: Android smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          set -e
          SDK=/usr/local/lib/android/sdk
          if [ ! -d "$SDK" ]; then SDK="$ANDROID_HOME"; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download android-latest --pattern PetStudio.apk --output PetStudio.apk --clobber

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install, screenshot
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -e
            adb uninstall io.github.vukiengiang.petstudio || true
            gradle -p android connectedDebugAndroidTest --no-daemon --stacktrace
            adb install PetStudio.apk
            adb shell am start -W -n io.github.vukiengiang.petstudio/.MainActivity
            sleep 14
            adb exec-out screencap -p > app.png
            adb shell am force-stop io.github.vukiengiang.petstudio
            sleep 2
            adb shell am start -W -n io.github.vukiengiang.petstudio/.MainActivity --es pack dsh-bot
            sleep 12
            adb exec-out screencap -p > app-bot.png
            adb shell am force-stop io.github.vukiengiang.petstudio
            sleep 2
            adb shell am start -W -n io.github.vukiengiang.petstudio/.MainActivity --es fx hearts
            sleep 6
            adb exec-out screencap -p > app-fx.png
            adb shell am force-stop io.github.vukiengiang.petstudio
            sleep 2
            adb shell am start -W -n io.github.vukiengiang.petstudio/.MainActivity --es chat demo
            sleep 6
            adb exec-out screencap -p > app-chat.png
            adb shell am force-stop io.github.vukiengiang.petstudio
            sleep 2
            adb shell am start -W -n io.github.vukiengiang.petstudio/.MainActivity --ez pip true
            sleep 7
            adb exec-out screencap -p > app-pip.png
            adb shell am force-stop io.github.vukiengiang.petstudio
            sleep 2
            adb shell am start -W -n io.github.vukiengiang.petstudio/.MainActivity --ez intro true
            sleep 9
            adb exec-out screencap -p > app-intro.png
            adb shell am force-stop io.github.vukiengiang.petstudio
            sleep 2
            adb shell am start -W -n io.github.vukiengiang.petstudio/.MainActivity --ez export true
            sleep 5
            adb shell ls -l /sdcard/Download/DSH-Go | tail -5 || true
            adb logcat -d -s PetStudio | grep "saved png" | tail -3 || true
            adb shell am force-stop io.github.vukiengiang.petstudio
            sleep 2
            adb shell am start -W -n io.github.vukiengiang.petstudio/.MainActivity --ez gif true
            sleep 7
            adb shell ls -l /sdcard/Download/DSH-Go | tail -5 || true
            adb shell am force-stop io.github.vukiengiang.petstudio
            sleep 2
            adb shell am start -W -n io.github.vukiengiang.petstudio/.MainActivity --es agent demo
            sleep 8
            adb exec-out screencap -p > app-agent.png
            adb shell am force-stop io.github.vukiengiang.petstudio
            sleep 2
            adb shell am start -W -n io.github.vukiengiang.petstudio/.MainActivity --es pack may-tet
            sleep 8
            adb exec-out screencap -p > app-tet.png
            adb exec-out sh -c 'cat $(ls -t /sdcard/Download/DSH-Go/*.gif | head -1)' > pet-export.gif || true
            ls -l pet-export.gif || true
            adb shell dumpsys appwidget | grep -i -A4 "io.github.vukiengiang.petstudio" | head -12 || true
            adb logcat -d -s PetWidget | tail -10 || true
            ls -l app.png app-bot.png app-fx.png app-chat.png app-pip.png app-intro.png
            adb logcat -d -s PetStudio | tail -30 || true

      - uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshot
          path: |
            pet-export.gif
            app.png
            app-bot.png
            app-fx.png
            app-chat.png
            app-pip.png
            app-intro.png
            app-agent.png
            app-tet.png
          if-no-files-found: warn
