name: Android smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Download latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download android-latest --pattern PetStudio.apk --output PetStudio.apk --clobber

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install, screenshot
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -e
            adb uninstall io.github.vukiengiang.petstudio || true
            adb install PetStudio.apk
            adb shell am start -W -n io.github.vukiengiang.petstudio/.MainActivity
            sleep 14
            adb exec-out screencap -p > app.png
            adb shell am force-stop io.github.vukiengiang.petstudio
            sleep 2
            adb shell am start -W -n io.github.vukiengiang.petstudio/.MainActivity --es pack dsh-bot
            sleep 12
            adb exec-out screencap -p > app-bot.png
            adb shell am force-stop io.github.vukiengiang.petstudio
            sleep 2
            adb shell am start -W -n io.github.vukiengiang.petstudio/.MainActivity --es fx hearts
            sleep 6
            adb exec-out screencap -p > app-fx.png
            adb shell am force-stop io.github.vukiengiang.petstudio
            sleep 2
            adb shell am start -W -n io.github.vukiengiang.petstudio/.MainActivity --es chat demo
            sleep 6
            adb exec-out screencap -p > app-chat.png
            adb shell am force-stop io.github.vukiengiang.petstudio
            sleep 2
            adb shell am start -W -n io.github.vukiengiang.petstudio/.MainActivity --ez pip true
            sleep 7
            adb exec-out screencap -p > app-pip.png
            ls -l app.png app-bot.png app-fx.png app-chat.png app-pip.png
            adb logcat -d -s PetStudio | tail -30 || true

      - uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshot
          path: |
            app.png
            app-bot.png
            app-fx.png
            app-chat.png
            app-pip.png
          if-no-files-found: error
