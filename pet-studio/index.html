<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10141C">
<meta name="color-scheme" content="dark">
<title>Pet Studio</title>
<link rel="stylesheet" href="pet-studio.css">
</head>
<body>
<header class="bar">
  <div class="brand">
    <strong>Pet Studio</strong>
    <span id="packInfo">đang tải…</span>
  </div>
  <div class="controls">
    <label>Pack
      <select id="pack" aria-label="Chọn pet pack"></select>
    </label>
    <label>Cỡ
      <select id="size" aria-label="Kích thước pet">
        <option value="30">Nhỏ · 30</option>
        <option value="40">Vừa · 40</option>
        <option value="64" selected>Lớn · 64</option>
        <option value="96">Khổng lồ · 96</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="quiet"> Im lặng</label>
    <label class="check"><input type="checkbox" id="demo"> Tự diễn</label>
  </div>
</header>

<main>
  <section class="stage" id="stage" aria-label="Sân khấu pet">
    <div class="bubble" id="bubble" hidden>
      <span id="bubbleText"></span>
      <button id="bubbleAction" hidden>Đã xử lý</button>
    </div>
    <div class="pet" id="pet"><canvas id="canvas" aria-label="Pet"></canvas></div>
    <div class="ground"></div>
  </section>

  <section class="panel">
    <div class="states" id="states" role="group" aria-label="Trạng thái">
      <button data-state="idle" title="idle">Đứng chờ</button>
      <button data-state="thinking" title="thinking">Đang nghĩ</button>
      <button data-state="working" title="working">Đang làm</button>
      <button data-state="attention" title="attention">Xong rồi</button>
      <button data-state="error" title="error">Gặp lỗi</button>
      <button data-state="notification" title="notification">Chờ bạn</button>
      <button data-state="sleeping" title="sleeping">Ngủ</button>
      <button data-state="waking" title="waking">Thức</button>
      <button data-state="roam" title="roam">Đi dạo</button>
    </div>
    <p class="hint">Chạm trái/phải để chọc, chạm 3 lần để cù, kéo để nhấc. Đứng yên 60 giây pet sẽ ngủ.</p>
    <p class="status" id="status" aria-live="polite">đang tải pack…</p>
  </section>
</main>

<footer class="foot">
  <span>dsh-go pets · <a href="https://github.com/vukiengiang2025-sys/dsh-go-pets">mã nguồn</a></span>
  <span id="version">v1.0.0</span>
</footer>

<script type="module" src="pet-studio.js"></script>
<script nomodule>
  document.body.innerHTML = '<div style="margin:auto;padding:24px;max-width:340px;text-align:center;font:16px/1.5 system-ui,sans-serif;color:#E9EEF7">'
    + '<h1 style="font-size:19px">Cần cập nhật Android System WebView</h1>'
    + '<p style="color:#93A0B5">Pet Studio cần WebView hỗ trợ JavaScript module. '
    + 'Mở CH Play, cập nhật “Android System WebView” rồi mở lại app.</p></div>';
</script>
</body>
</html>
